id: code-03
category: coding
prompt: "stats.py has a bug in median(): it is wrong for lists with an even number of items. Fix the bug in stats.py (keep the function name)."
setup_files:
  stats.py: |
    def median(xs):
        xs = sorted(xs)
        return xs[len(xs) // 2]
grader:
  type: unit_test
  test_code: |
    from stats import median
    assert median([3, 1, 2]) == 2
    assert median([4, 1, 3, 2]) == 2.5
    assert median([10, 20]) == 15
    assert median([5]) == 5
    assert median([7, -3, 11, 0]) == 3.5
    assert median([2.5, 1.5]) == 2.0
