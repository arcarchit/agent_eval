id: judge-01
category: writing
prompt: "Explain to a 10-year-old why the sky is blue, in at most 3 sentences."
grader:
  type: llm_judge
  rubric: |
    1. It is at most 3 sentences.
    2. It says sunlight contains many colours and blue light is scattered more by the air (no factual errors).
    3. The language is simple enough for a 10-year-old. Everyday science words such as "scatter",
       "scattering", "particles", "atmosphere" or "waves" are allowed, especially when the answer explains
       them in plain words. Fail this point only for technical terms such as "Rayleigh", "wavelength",
       "nanometre" or "cross-section" used without a plain explanation.
