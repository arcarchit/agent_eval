id: code-04
category: coding
prompt: "Create solution.py with a function merge_intervals(intervals: list[list[int]]) -> list[list[int]] that merges overlapping or touching intervals and returns them sorted by start."
grader:
  type: unit_test
  test_code: |
    from solution import merge_intervals
    assert merge_intervals([[1,3],[2,6],[8,10],[15,18]]) == [[1,6],[8,10],[15,18]]
    assert merge_intervals([[1,4],[4,5]]) == [[1,5]]
    assert merge_intervals([]) == []
    assert merge_intervals([[5,7],[1,2]]) == [[1,2],[5,7]]
